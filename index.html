<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestão de Contatos - Shopping Tacaruna</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div id="telaLogin" class="tela-login">
    <div class="card-login">
      
      <img src="https://www.shoppingtacaruna.com.br/assets/images/shopping-tacaruna.svg" alt="Shopping Tacaruna" class="logo-img" />
      
      <div class="login-header">
        <h1>Gestão de Contatos</h1>
        <span class="badge">Informe de Vendas</span>
      </div>
      
      <p class="subtitulo">Acesse o painel administrativo para continuar</p>

      <form id="formLogin" class="form-login">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="username" />
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-primary">Entrar no Sistema</button>
      </form>

      <div id="msgLogin"></div>
    </div>
  </div>

  <!-- ==================== APLICAÇÃO ==================== -->
  <div id="app" style="display:none;">
    
    <!-- Header Profissional -->
    <header class="topbar">
      <div class="topbar-brand">
        <img src="https://www.shoppingtacaruna.com.br/assets/images/shopping-tacaruna.svg" alt="Logo" class="brand-logo" />
        <div class="brand-text">
          <h1>Gestão de Contatos</h1>
          <span id="usuarioLogado" class="user-email"></span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btnExportar" class="btn-export">📥 Exportar Excel</button>
        <button id="btnSair" class="btn-outline">Sair</button>
      </div>
    </header>

    <main class="content">
      
      <!-- Dashboard Cards -->
      <div class="dashboard-cards">
        <div class="card">
          <span class="card-title">Total de Lojas</span>
          <span class="card-value" id="cardTotalLojas">0</span>
        </div>
        <div class="card">
          <span class="card-title">Contatos Pendentes</span>
          <span class="card-value text-warning" id="cardPendentes">0</span>
        </div>
        <div class="card">
          <span class="card-title">Contatos Preenchidos</span>
          <span class="card-value text-success" id="cardPreenchidos">0</span>
        </div>
      </div>

      <!-- Filtros -->
<div class="toolbar">
  <div class="search-box">
    <span class="search-icon">🔎</span>
    <input type="text" id="filtroBusca" placeholder="Buscar por loja, LUC ou responsável..." />
  </div>
  <div class="filter-box">
    <select id="filtroPiso">
      <option value="">Todos os Pisos</option>
      <option value="L1">Piso L1</option>
      <option value="L2">Piso L2</option>
      <option value="L3">Piso L3</option>
      <option value="L4">Piso L4</option>
    </select>
  </div>
  <div class="filter-box">
    <select id="filtroStatus">
      <option value="">Todos os Status</option>
      <option value="pendente">⚠️ Sem informação</option>
      <option value="parcial">🟡 Parcialmente preenchido</option>
      <option value="completo">✅ Completo</option>
    </select>
  </div>
  <button id="btnNovaLoja" class="btn-primary" style="width:auto; padding:12px 20px;">
    ➕ Nova Loja
  </button>
</div>

      <div id="mensagem"></div>

      <!-- Tabela -->
      <div class="table-container">
        <table id="tabelaLojas">
          <thead>
            <tr>
              <th>Loja / LUC</th>
              <th>Nome</th>
              <th>Função</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      
    </main>
  </div>

  <!-- ==================== MODAL NOVA LOJA ==================== -->
  <div id="modalNovaLoja" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2>➕ Nova Loja</h2>
      <form id="formNovaLoja">
        <div class="input-group">
          <label>Piso *</label>
          <select id="novaPiso" required>
            <option value="">Selecione...</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
            <option value="L4">L4</option>
          </select>
        </div>
        <div class="input-group">
          <label>LUC *</label>
          <input type="text" id="novaLuc" placeholder="Ex: 100AT" required />
        </div>
        <div class="input-group">
          <label>Nome da Loja *</label>
          <input type="text" id="novaLoja" placeholder="Ex: Lojas Americanas" required />
        </div>
        <div class="modal-actions">
          <button type="button" id="btnCancelarNova" class="btn-outline">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto; padding:12px 24px;">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW erro:', err));
      });
    }
  </script>
</body>
</html>
